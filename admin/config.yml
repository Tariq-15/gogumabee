backend:
  name: github
  repo: Tariq-15/gogumabee
  branch: main
site_url: https://gogumabee.vercel.app
logo_url: https://gogumabee.vercel.app/img/logo.png
media_folder: img/uploads
public_folder: img/uploads
media_libraries:
  default:
    config:
      transformations:
        raster_image: { format: webp, quality: 82, width: 1200 }
collections:
  - name: gallery
    label: Artwork gallery
    icon: photo_library
    files:
      - name: gallery-sketch
        label: Pencil sketches
        file: content/gallery-sketch.json
        fields:
          - name: items
            label: Pencil sketches
            hint: New artworks go to the top. Click one to edit, or drag to reorder.
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{fields.alt}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Description, hint: Short sentence about the drawing. Also used for screen readers., widget: string }
              - { name: also, label: Also show under (optional), widget: select, multiple: true, required: false, options: [{label: Pencil sketches, value: sketch}, {label: Coloured, value: color}, {label: Ships & duos, value: ship}, {label: Chibis & doodles, value: chibi}, {label: Full body, value: extra}] }
              - { name: thumb, widget: hidden, required: false }
              - { name: w, widget: hidden, required: false }
              - { name: h, widget: hidden, required: false }
      - name: gallery-color
        label: Coloured
        file: content/gallery-color.json
        fields:
          - name: items
            label: Coloured
            hint: New artworks go to the top. Click one to edit, or drag to reorder.
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{fields.alt}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Description, hint: Short sentence about the drawing. Also used for screen readers., widget: string }
              - { name: also, label: Also show under (optional), widget: select, multiple: true, required: false, options: [{label: Pencil sketches, value: sketch}, {label: Coloured, value: color}, {label: Ships & duos, value: ship}, {label: Chibis & doodles, value: chibi}, {label: Full body, value: extra}] }
              - { name: thumb, widget: hidden, required: false }
              - { name: w, widget: hidden, required: false }
              - { name: h, widget: hidden, required: false }
      - name: gallery-ship
        label: Ships & duos
        file: content/gallery-ship.json
        fields:
          - name: items
            label: Ships & duos
            hint: New artworks go to the top. Click one to edit, or drag to reorder.
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{fields.alt}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Description, hint: Short sentence about the drawing. Also used for screen readers., widget: string }
              - { name: also, label: Also show under (optional), widget: select, multiple: true, required: false, options: [{label: Pencil sketches, value: sketch}, {label: Coloured, value: color}, {label: Ships & duos, value: ship}, {label: Chibis & doodles, value: chibi}, {label: Full body, value: extra}] }
              - { name: thumb, widget: hidden, required: false }
              - { name: w, widget: hidden, required: false }
              - { name: h, widget: hidden, required: false }
      - name: gallery-chibi
        label: Chibis & doodles
        file: content/gallery-chibi.json
        fields:
          - name: items
            label: Chibis & doodles
            hint: New artworks go to the top. Click one to edit, or drag to reorder.
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{fields.alt}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Description, hint: Short sentence about the drawing. Also used for screen readers., widget: string }
              - { name: also, label: Also show under (optional), widget: select, multiple: true, required: false, options: [{label: Pencil sketches, value: sketch}, {label: Coloured, value: color}, {label: Ships & duos, value: ship}, {label: Chibis & doodles, value: chibi}, {label: Full body, value: extra}] }
              - { name: thumb, widget: hidden, required: false }
              - { name: w, widget: hidden, required: false }
              - { name: h, widget: hidden, required: false }
      - name: gallery-extra
        label: Full body
        file: content/gallery-extra.json
        fields:
          - name: items
            label: Full body
            hint: New artworks go to the top. Click one to edit, or drag to reorder.
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{fields.alt}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Description, hint: Short sentence about the drawing. Also used for screen readers., widget: string }
              - { name: also, label: Also show under (optional), widget: select, multiple: true, required: false, options: [{label: Pencil sketches, value: sketch}, {label: Coloured, value: color}, {label: Ships & duos, value: ship}, {label: Chibis & doodles, value: chibi}, {label: Full body, value: extra}] }
              - { name: thumb, widget: hidden, required: false }
              - { name: w, widget: hidden, required: false }
              - { name: h, widget: hidden, required: false }
  - name: site
    label: Site content
    icon: edit_note
    files:
      - name: status
        label: Open / closed
        file: content/status.json
        fields:
          - { name: status, label: Are commissions open right now?, widget: select, options: [OPEN, CLOSED] }
      - name: prices
        label: Prices
        file: content/prices.json
        fields:
          - name: cards
            label: Price cards
            widget: list
            collapsed: true
            summary: '{{fields.title}} · from {{fields.price}}'
            fields:
              - { name: image, label: Example image, widget: image }
              - { name: pos, widget: hidden, required: false }
              - { name: alt, label: Image description, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: price, label: Starting price (e.g. $15), widget: string }
              - { name: items, label: What's included, widget: list, field: { name: item, widget: string } }
              - { name: type, label: Name in the order form, widget: string }
              - { name: featured, label: Highlight as "most loved", widget: boolean, required: false }
      - name: about
        label: About me
        file: content/about.json
        fields:
          - { name: about, label: About text (one box per paragraph), widget: list, field: { name: paragraph, widget: text } }
      - name: faq
        label: FAQ
        file: content/faq.json
        fields:
          - name: faq
            label: FAQ
            hint: Use **double stars** for bold.
            widget: list
            collapsed: true
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
