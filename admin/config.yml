backend:
  name: github
  repo: Tariq-15/gogumabee
  branch: main
site_url: https://gogumabee.vercel.app
logo_url: https://gogumabee.vercel.app/img/logo.png
media_folder: img/uploads
public_folder: img/uploads
media_libraries:
  default:
    config:
      transformations:
        raster_image: { format: webp, quality: 82, width: 1200 }
collections:
  - name: gallery
    label: Artwork gallery
    icon: photo_library
    files:
      - name: gallery
        label: Gallery (newest first)
        file: content/gallery.json
        fields:
          - name: items
            label: Artworks
            hint: New artworks go to the top. Click one to edit, or drag to reorder.
            widget: list
            add_to_top: true
            collapsed: true
            summary: '{{fields.alt}}'
            fields:
              - { name: image, label: Image, widget: image }
              - { name: cats, label: Categories, widget: select, multiple: true, options: [{label: Pencil sketches, value: sketch}, {label: Coloured, value: color}, {label: Ships & duos, value: ship}, {label: Chibis & doodles, value: chibi}, {label: Full body, value: extra}] }
              - { name: alt, label: Description, hint: Short sentence about the drawing. Also used for screen readers., widget: string }
              - { name: thumb, widget: hidden, required: false }
              - { name: w, widget: hidden, required: false }
              - { name: h, widget: hidden, required: false }
  - name: site
    label: Commissions
    icon: sell
    files:
      - name: site
        label: Status, prices, about & FAQ
        file: content/site.json
        fields:
          - { name: status, label: Commissions are, widget: select, options: [OPEN, CLOSED] }
          - name: cards
            label: Price cards
            widget: list
            collapsed: true
            summary: '{{fields.title}} · from {{fields.price}}'
            fields:
              - { name: image, label: Example image, widget: image }
              - { name: pos, widget: hidden, required: false }
              - { name: alt, label: Image description, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: price, label: Starting price (e.g. $15), widget: string }
              - { name: items, label: What's included, widget: list, field: { name: item, widget: string } }
              - { name: type, label: Name in the order form, widget: string }
              - { name: featured, label: Highlight as "most loved", widget: boolean, required: false }
          - { name: about, label: About text (one box per paragraph), widget: list, field: { name: paragraph, widget: text } }
          - name: faq
            label: FAQ
            hint: Use **double stars** for bold.
            widget: list
            collapsed: true
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
